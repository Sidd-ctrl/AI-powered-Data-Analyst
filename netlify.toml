[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward API requests to your deployed FastAPI backend.
# Replace this example hostname with your actual Render hostname.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-NAME.onrender.com/api/:splat"
  status = 200
  force = true

# Serve the React application for non-API routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"